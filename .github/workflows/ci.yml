name: Payment Ledger Engine CI

on:
  push:
    branches: [ main, master, develop ]
    paths:
      - 'payment-ledger-engine/**'
  pull_request:
    branches: [ main, master ]
    paths:
      - 'payment-ledger-engine/**'
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build, Test & Verify
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: payment-ledger-engine

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Compile and Static Check
        run: mvn clean compile -B

      - name: Run Unit Tests
        run: mvn test -B

      - name: Package JAR
        run: mvn package -DskipTests -B

      - name: Build Docker Image
        run: docker build -t payment-ledger-engine:test .

