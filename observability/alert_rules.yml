groups:
  - name: ledger_alerts
    rules:
      # ── SLA & SLO Alerts ──────────────────────────────────────────
      - alert: SLA_AvailabilityBreach
        expr: (sum(rate(http_server_requests_seconds_count{status=~"2.."}[1m])) / clamp_min(sum(rate(http_server_requests_seconds_count[1m])), 0.001)) * 100 < 99.9
        for: 10s
        labels:
          severity: critical
          category: sla
        annotations:
          summary: "SLA Availability Breached (< 99.9%)"
          description: "Current transfer success rate has dropped below the 99.9% SLA target."

      - alert: SLA_P99_LatencyExceeded
        expr: histogram_quantile(0.99, sum(rate(http_server_requests_seconds_bucket[1m])) by (le)) * 1000 > 250
        for: 10s
        labels:
          severity: warning
          category: sla
        annotations:
          summary: "SLA p99 Latency Target Exceeded (> 250ms)"
          description: "p99 latency is currently exceeding the 250ms SLA threshold."

      # ── SOS & Chaos Alerts ─────────────────────────────────────────
      - alert: SOS_RateLimitingSpike
        expr: sum(rate(http_server_requests_seconds_count{status="429"}[30s])) > 2
        for: 5s
        labels:
          severity: warning
          category: security
        annotations:
          summary: "High 429 Rate Limiting Throttling Active"
          description: "Nginx rate limiter is throttling requests. Potential traffic surge or DDoS."

      - alert: SOS_HighServerErrorRate
        expr: sum(rate(http_server_requests_seconds_count{status=~"5.."}[30s])) > 0.5
        for: 5s
        labels:
          severity: critical
          category: availability
        annotations:
          summary: "HTTP 5xx Server Errors Detected"
          description: "Backend is returning 5xx server errors."

      # ── Anomaly & Resource Alerts ──────────────────────────────────
      - alert: Anomaly_OutboxEventLagHigh
        expr: outbox_pending_events > 25
        for: 10s
        labels:
          severity: warning
          category: anomaly
        annotations:
          summary: "Transactional Outbox Queue Lagging"
          description: "Outbox table has pending events waiting for Kafka publishing."

      - alert: Anomaly_JvmHeapMemoryHigh
        expr: (jvm_memory_used_bytes{area="heap"} / jvm_memory_max_bytes{area="heap"}) * 100 > 75
        for: 15s
        labels:
          severity: warning
          category: resource
        annotations:
          summary: "JVM Heap Utilization > 75%"
          description: "JVM Heap memory usage is elevated."
